<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII-букет</title>
<style>
  html,body{margin:0;height:100%;background:#0c0e1a;overflow:hidden;color:#cfd3ff;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  canvas{position:fixed;inset:0;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  #ui{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:12px 12px calc(12px + env(safe-area-inset-bottom));}
  .row{display:flex;gap:8px;justify-content:center;align-items:center;width:100%;max-width:420px}
  #msg{flex:1;min-width:0;background:#171a2e;border:1px solid #2c3157;color:#ffb3c7;
    border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;outline:none}
  #msg:focus{border-color:#ff6f91}
  button{background:#171a2e;border:1px solid #2c3157;color:#cfd3ff;border-radius:10px;
    padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
  button.on{border-color:#ff6f91;color:#ffb3c7}
  .types button{flex:1}
  #speed{flex:1;accent-color:#ff6f91;min-width:0}
  label{font-size:12px;opacity:.6}
  #hint{position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;text-align:center;
    font-size:12px;opacity:.45;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">тягни, щоб крутити</div>
<div id="ui">
  <div class="row types">
    <button data-t="wild" class="on">польові</button>
    <button data-t="peony">піони</button>
    <button data-t="rose">троянди</button>
  </div>
  <div class="row">
    <label for="speed">швидкість</label>
    <input id="speed" type="range" min="0" max="10" step="0.5" value="3.5">
    <button id="spin">⏸</button>
  </div>
</div>
<script>
const FONT = 'ui-monospace, Menlo, Consolas, monospace';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const spinBtn = document.getElementById('spin'),
      speedEl = document.getElementById('speed');

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const norm=v=>{const l=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/l,v[1]/l,v[2]/l]};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];

const GREENS = ['#5fd38a','#7be0a0','#3fb872','#9be8a8'];
const TYPES = {
  wild:  {n:11, R:[0.34,0.48], pal:['#ff6f91','#ffd166','#7a9bff','#b388ff','#ff9a76','#f4f1ff','#ff8fd0'], core:'#ffe9a8'},
  peony: {n:11, R:[0.36,0.46], pal:['#ff9ec4','#ffc2d9','#fff0f5','#ff7fae','#ffd1b8'], core:'#ff5c93'},
  rose:  {n:12, R:[0.34,0.44], pal:['#ff3b5c','#e8284f','#ff6b81','#ff4d6d','#ffb703','#f8f0ff'], core:'#b3123a'}
};


function shade(hex,f){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  if(f<=1){r*=f;g*=f;b*=f}else{const k=Math.min(1,f-1);r+=(255-r)*k;g+=(255-g)*k;b+=(255-b)*k}
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
}
const RAMP=['.',':','o','0','O','8','@'];
function layered(put,R,col,core,o){
  for(let l=0;l<o.L;l++){
    const lf=l/(o.L-1), pc=o.pc(l), rb=o.rb(lf), ext=o.ext(lf), hb=o.hb(lf);
    for(let p=0;p<pc;p++){
      const tc=l*o.phase+p*6.28318/pc;
      for(let si=0;si<=o.S;si++){
        const s=si/o.S;
        const wid=(3.14159/pc)*o.wide*(0.45+0.55*Math.sqrt(s))*Math.sqrt(Math.max(0,1-Math.pow(s,8)));
        for(let fi=0;fi<=o.F;fi++){
          const phi=-1+2*fi/o.F, th=tc+phi*wid;
          const ruf=1+o.ruf*Math.sin(o.rufn*th+l*1.7)*s;
          const rho=(rb+ext*s)*ruf;
          const lift=hb+o.curl(lf,s)+o.rip*R*Math.sin(o.rufn*0.7*th+l)*s;
          let f=o.f0+o.f1*s-0.14*phi*phi+lf*o.lfDark;
          if(s>0.88) f+=0.22;
          if(Math.abs(phi)>0.86) f-=0.28;
          const ch=RAMP[Math.max(0,Math.min(6,Math.round((f-0.5)/0.75*6)))];
          put(rho,th,lift,ch,shade(col,f));
        }
      }
    }
  }
  // центр
  if(o.center==='spiral'){
    for(let k=0;k<220;k++){
      const t=k/220, th=t*3*6.28318, r=R*(0.04+0.30*t);
      const f=0.5+0.55*(Math.floor(t*7)%2)+0.2*t;
      put(r,th,o.hb(0)+R*(0.26-0.14*t),RAMP[Math.max(0,Math.min(6,Math.round((f-0.5)/0.75*6)))],shade(col,f));
    }
  } else {
    for(let k=0;k<70;k++){
      const r=R*0.16*Math.sqrt(k/70), th=k*2.39996;
      put(r,th,o.hb(0)+R*0.08,'@',shade(core,0.8));
    }
    for(let k=0;k<26;k++){
      const th=k/26*6.28318;
      put(R*0.24,th,o.hb(0)+R*0.12,'*',core);
    }
  }
}

const ROSE_COLORS=['#c8102e','#8e0b24','#f48fb1','#e8588c','#fbf1e6','#f6e3b4','#f5c431','#f8a58a','#ef6c57','#f28c28','#bfa2db','#5e0b20'];
const PEONY_COLORS=['#f8c8d4','#f29bb8','#e0568a','#f6907b','#fdf2f2','#b8326e','#b01c3c','#fbd3b8','#d9a3c9'];
function tone(hex,k){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  if(k<1){r*=k;g*=k;b*=k}else{const t=Math.min(1,k-1);r+=(255-r)*t;g+=(255-g)*t;b+=(255-b)*t}
  const h=v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0');
  return '#'+h(r)+h(g)+h(b);
}
let pts = [];
let extent = 4.8;
function hsl(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;const a=s*Math.min(l,1-l);
  const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(255*c).toString(16).padStart(2,'0')};
  return '#'+f(0)+f(8)+f(4)}

function build(type){
  const T = TYPES[type], rnd = rng((Math.random()*1e9)|0);
  pts = [];
  const base = [0,-1.8,0];
  // випадкові параметри букета
  const hue0=rnd()*360, scheme=rnd();
  const pal=[0,1,2,3,4,5].map(k=>hsl(hue0+(scheme<.5?k*(8+rnd()*10):k*(30+rnd()*40)), 62+rnd()*28, 56+rnd()*16));
  const core=hsl(hue0+(rnd()<.5?0:40),80,32);
  const bases=[];
  if(type!=='wild'){
    const PAL=type==='rose'?ROSE_COLORS:PEONY_COLORS, nb=rnd()<0.55?1:2;
    for(let k=0;k<nb;k++) bases.push(PAL[Math.floor(rnd()*PAL.length)]);
  }
  const sz=0.75+rnd()*0.65;
  const N=Math.min(type==='wild'?16:12,Math.max(6,Math.round(T.n/(sz*sz))));
  const spread=1.5+rnd()*0.9, topH=0.35+rnd()*0.6, lean=0.5+rnd()*1.0;
  extent=(spread+0.9)*2;
  const op=0.6+rnd()*0.9, wideV=1.1+rnd()*0.3, rufV=0.6+rnd()*1.0;
  const petalsBase=4+Math.floor(rnd()*5);
  const pcP=6+Math.floor(rnd()*3), pcR=4+Math.floor(rnd()*3);

  for (let i=0;i<N;i++){
    const a = i*2.39996;
    const r = 0.2 + (spread-0.2)*Math.sqrt((i+0.5)/N);
    const H = [Math.cos(a)*r, 0.55 + topH*(1-(r/(spread+0.2))**2) + (rnd()-0.5)*0.15, Math.sin(a)*r];
    let color = pal[i % pal.length], fcore = core;
    if(type!=='wild'){
      const b=bases[(rnd()<0.72)?0:(bases.length-1)];
      color=tone(b,0.84+rnd()*0.4);
      fcore=type==='peony'?'#f2c14e':tone(color,0.5);
    }
    const R = (T.R[0] + rnd()*(T.R[1]-T.R[0]))*sz;

    // стебло
    const bend = [(rnd()-0.5)*0.25, 0, (rnd()-0.5)*0.25];
    for (let k=0;k<=100;k++){
      const t=k/100, s=Math.sin(t*Math.PI);
      pts.push({x:base[0]+(H[0]-base[0])*t+bend[0]*s, y:base[1]+(H[1]-base[1])*t, z:base[2]+(H[2]-base[2])*t+bend[2]*s,
        ch:['|','!',':'][k%3], c:GREENS[i%GREENS.length]});
    }
    // листочки
    for (const t of [0.35,0.55]){
      const side = rnd()<.5?-1:1, ang = rnd()*6.28;
      const cx = base[0]+(H[0]-base[0])*t, cy = base[1]+(H[1]-base[1])*t, cz = base[2]+(H[2]-base[2])*t;
      for (let k=0;k<40;k++){
        const u=k/39, w=Math.sin(u*Math.PI)*0.08, L=u*0.38;
        pts.push({x:cx+Math.cos(ang)*L*side, y:cy+L*0.35, z:cz+Math.sin(ang)*L*side+(rnd()-.5)*w*2,
          ch:'v', c:GREENS[(k+i)%GREENS.length]});
      }
    }

    // локальна система координат голівки
    const n = norm([H[0]-base[0], H[1]-base[1]+lean, H[2]-base[2]]);
    let u = norm(cross(n,[0,0,1])); if (Math.hypot(...cross(n,[0,0,1]))<0.2) u = norm(cross(n,[1,0,0]));
    const v = cross(n,u);
    const put = (rr,th,lift,ch,c)=>{
      const cs=Math.cos(th), sn=Math.sin(th);
      pts.push({x:H[0]+(u[0]*cs+v[0]*sn)*rr+n[0]*lift, y:H[1]+(u[1]*cs+v[1]*sn)*rr+n[1]*lift,
                z:H[2]+(u[2]*cs+v[2]*sn)*rr+n[2]*lift, ch, c});
    };

    if (type==='wild'){
      const ph=rnd()*6.28, petals=petalsBase+(i%2), steps=18;
      for (let j=1;j<=steps;j++){
        const t=j/steps, cnt=10+Math.round(t*70);
        for (let q=0;q<cnt;q++){
          const th=q/cnt*6.28318, m=1+0.28*Math.cos(petals*th+ph), rr=t*R*m, lift=0.2*rr*rr/R;
          put(rr,th,lift, t<0.2?'@':(t>0.82?'o':((j+q)%2?'0':'O')), t<0.2?core:color);
        }
      }
    } else if (type==='peony'){
      layered(put, R, color, fcore, {
        L:7, pc:l=>pcP+(l%3), phase:0.9, wide:wideV+0.1, center:'stamens',
        rb:lf=>R*(0.14+0.84*Math.pow(lf,0.9)),
        ext:lf=>R*(0.40+0.30*lf),
        hb:lf=>R*0.40*op*Math.pow(1-lf,1.1),
        curl:(lf,s)=>R*op*(0.12*s*(1-lf)-0.10*s*s*lf),
        ruf:0.10*rufV, rufn:11, rip:0.05, f0:0.55, f1:0.62, lfDark:0.12, S:7, F:8});
    } else { // троянда
      layered(put, R, color, fcore, {
        L:7, pc:l=>pcR, phase:0.63, wide:wideV, center:'spiral',
        rb:lf=>R*(0.20+0.78*lf),
        ext:lf=>R*(0.22+0.40*lf),
        hb:lf=>R*0.46*op*Math.pow(1-lf,1.1),
        curl:(lf,s)=>R*op*(0.12*s*(0.8-lf)),
        ruf:0.05*rufV, rufn:7, rip:0.03, f0:0.50, f1:0.72, lfDark:0.10, S:9, F:10});
    }
  }

  // стрічка-зав'язка
  for (let k=0;k<50;k++){
    const th=k/50*6.28318;
    pts.push({x:Math.cos(th)*0.17, y:-1.35, z:Math.sin(th)*0.17, ch:'#', c:'#ff6f91'});
    pts.push({x:Math.cos(th)*0.19, y:-1.42, z:Math.sin(th)*0.19, ch:'=', c:'#ff9ab3'});
  }
  // іскорки
  for (let k=0;k<70;k++){
    const th=rnd()*6.28, ph=Math.acos(2*rnd()-1), rr=2.0+rnd()*1.2;
    pts.push({x:rr*Math.sin(ph)*Math.cos(th), y:rr*Math.cos(ph)*0.9+0.2, z:rr*Math.sin(ph)*Math.sin(th),
      ch:['.','*','+','·','°'][k%5], c:'#d9dcff', sp:true, tw:rnd()*6.28});
  }
}
build('wild');

document.querySelectorAll('.types button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.types button').forEach(x=>x.classList.toggle('on',x===b));
  build(b.dataset.t);
});

// канва
let W,H,dpr,fs,cw,chh,cols,rows,zbuf,cell;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  fs=Math.max(9,Math.min(16,Math.round(Math.min(W,H*1.1)/50)));
  ctx.font=fs+'px '+FONT; cw=ctx.measureText('M').width; chh=fs*1.15;
  cols=Math.ceil(W/cw); rows=Math.ceil(H/chh);
  zbuf=new Float32Array(cols*rows); cell=new Array(cols*rows);
}
addEventListener('resize',resize); resize();

let ang=0.6, tilt=0.28, auto=true, dragging=false, lx=0, ly=0;
cv.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!dragging)return;
  ang+=(e.clientX-lx)*0.01; tilt=Math.max(-0.25,Math.min(1.5,tilt+(e.clientY-ly)*0.005)); lx=e.clientX; ly=e.clientY});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>dragging=false));
spinBtn.onclick=()=>{auto=!auto; spinBtn.textContent=auto?'⏸':'▶'};

const D=5;
function frame(time){
  if(auto&&!dragging) ang+=speedEl.value*0.0012;   // за замовчуванням ≈0.004 рад/кадр
  ctx.fillStyle='#0c0e1a'; ctx.fillRect(0,0,W,H);
  zbuf.fill(1e9); cell.fill(undefined);
  const cy=Math.cos(ang), sy=Math.sin(ang), cx=Math.cos(tilt), sx=Math.sin(tilt);
  const scale=Math.min(W/extent, (H-170)/4.4), ox=W/2, oy=(H-150)*0.48;
  for (let i=0;i<pts.length;i++){
    const p=pts[i];
    const x=p.x*cy+p.z*sy, z=-p.x*sy+p.z*cy;
    const y2=p.y*cx-z*sx, z2=p.y*sx+z*cx;
    const s=D/(D+z2);
    const col=((ox+x*s*scale)/cw)|0, row=((oy-y2*s*scale)/chh)|0;
    if(col<0||row<0||col>=cols||row>=rows) continue;
    const idx=row*cols+col;
    if(z2<zbuf[idx]){zbuf[idx]=z2; cell[idx]=p;}
  }
  ctx.textBaseline='top'; ctx.font=fs+'px '+FONT;
  for (let idx=0;idx<cell.length;idx++){
    const p=cell[idx]; if(!p) continue;
    let a=1-Math.min(1,Math.max(0,(zbuf[idx]+2.2)/4.4))*0.6;
    if(p.sp) a*=0.25+0.75*(0.5+0.5*Math.sin(time*0.003+p.tw));
    ctx.globalAlpha=a; ctx.fillStyle=p.c;
    ctx.fillText(p.ch,(idx%cols)*cw,((idx/cols)|0)*chh);
  }
  ctx.globalAlpha=0.9; ctx.fillStyle='#ff8fa8'; ctx.textAlign='center';
  ctx.font=(fs*1.1)+'px '+FONT;
  ctx.fillText('For you my love ♥', W/2, H-120);
  ctx.textAlign='left'; ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
